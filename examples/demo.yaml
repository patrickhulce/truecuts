# TrueCuts demo — Assembly Bench
# Left: browse members, or edit YAML. Right: the 3D scene updates live.
# See SPEC.md for the full document format.
#
# Numeric dimensions are L×W×T, longest → shortest. A 2x4x8 is 8′ × 3.5″ × 1.5″.
# Default local frame: X=L, Z=W, Y=T (LxW@0 down). Connections (screws, glue,
# brackets) join members. Anything not reachable from the first member of the
# first component renders in red/white stripes.

version: 1
name: Assembly Bench

members:
  - label: Leg
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 30 }

  - label: Leg
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 30 }

  - label: Leg
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 30 }

  - label: Leg
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 30 }

  - label: Long apron
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 33 }

  - label: Long apron
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 33 }

  - label: Short apron
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 21 }

  - label: Short apron
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 21 }

  - label: Brace
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 33 }

  - id: top-1
    label: Top
    stock: plywood-3/4-4x8
    cuts:
      - { axis: 0, angle: 90, at: 40 }
      - { axis: 1, angle: 90, at: 24 }
    bores:
      - { face: LxW@1, at: [20, 12], diameter: 1, depth: 0.5 }

  - label: Shelf board
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 24 }

  - label: Spare block
    stock: 2x4x8
    cuts:
      - { axis: 0, angle: 90, at: 8 }

  - label: Corner bracket
    stock: bracket-l-1.5x1.5

  - label: Corner bracket
    stock: bracket-l-1.5x1.5

  - label: Corner bracket
    stock: bracket-l-1.5x1.5

  - label: Corner bracket
    stock: bracket-l-1.5x1.5

  # 6×6 post and a beam in a bolted saddle.
  - label: Post
    stock: 6x6x8
    cuts:
      - { axis: 0, angle: 90, at: 30 }

  - label: Beam
    stock: 6x6x8
    cuts:
      - { axis: 0, angle: 90, at: 12 }

  - label: Beam saddle
    stock: saddle
    size: [12, 5.5]

components:
  - label: Bench
    position: [ 0, 0, 0 ]
    rotation: [ 0, 0, 0 ]
    members:
      # Standing 2x4s: [90, 90, 0] sends L up world Y, W along +X, T along +Z.
      - { id: leg-1, position: [ 0, 0, 0 ], rotation: [ 90, 90, 0 ] }
      - { id: leg-2, position: [ 36.5, 0, 0 ], rotation: [ 90, 90, 0 ] }
      - { id: leg-3, position: [ 0, 0, 22.5 ], rotation: [ 90, 90, 0 ] }
      - { id: leg-4, position: [ 36.5, 0, 22.5 ], rotation: [ 90, 90, 0 ] }
      # Aprons: [90, 0, 0] stands W up (−Y from the top origin); hang from LxT@0.
      - { id: long-apron-1, position: [ 3.5, 30, 0.5 ], rotation: [ 90, 0, 0 ] }
      - { id: long-apron-2, position: [ 3.5, 30, 22 ], rotation: [ 90, 0, 0 ] }
      - { id: short-apron-1, position: [ 0.5, 30, 22.5 ], rotation: [ 90, 0, -90 ] }
      - { id: short-apron-2, position: [ 38, 30, 22.5 ], rotation: [ 90, 0, -90 ] }
      # Lower front stretcher between the front legs.
      - { id: brace-1, position: [ 3.5, 13.5, 0 ], rotation: [ 90, 0, 0 ] }
      # Plywood sits flat by default (T along +Y).
      - { id: top-1, position: [ 0, 30, 0 ], rotation: [ 0, 0, 0 ] }
      # L-brackets under the long aprons, down LxT@1 of each leg (local +Z → world +X).
      - { id: corner-bracket-1, position: [ 3.5, 26.5, 1.5 ], rotation: [ 180, 0, 0 ] }
      - { id: corner-bracket-2, position: [ 36.5, 26.5, 0 ], rotation: [ 0, 0, 180 ] }
      - { id: corner-bracket-3, position: [ 3.5, 26.5, 24 ], rotation: [ 180, 0, 0 ] }
      - { id: corner-bracket-4, position: [ 36.5, 26.5, 22.5 ], rotation: [ 0, 0, 180 ] }
      # Post stands against leg-2. Beam sits in the saddle and butts the post.
      - { id: post-1, position: [ 40, 0, 0 ], rotation: [ 90, 90, 0 ] }
      - { id: beam-saddle-1, position: [ 45.5, 0, -0.25 ], rotation: [ 0, 0, 0 ] }
      - { id: beam-1, position: [ 45.5, 0.25, 0 ], rotation: [ 0, 0, 0 ] }
    connections:
      # Butt screws: head in the first member, tip into the second. Centered on the contact.
      - members:
          - { id: long-apron-1 }
          - { id: leg-1 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: long-apron-1 }
          - { id: leg-2 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: long-apron-2 }
          - { id: leg-3 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: long-apron-2 }
          - { id: leg-4 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: short-apron-1 }
          - { id: leg-1 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: short-apron-1 }
          - { id: leg-3 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: short-apron-2 }
          - { id: leg-2 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: short-apron-2 }
          - { id: leg-4 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: brace-1 }
          - { id: leg-1 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      - members:
          - { id: brace-1 }
          - { id: leg-2 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x2.5, variant: { kind: centered, separation: 6, justify: space-around } }
      # One screw through each bracket flange into the apron and the leg.
      - members:
          - { id: corner-bracket-1 }
          - { id: long-apron-1 }
          - { id: leg-1 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: angle-bracket, bracket: corner-bracket-1, edge: 0.25 } }
      - members:
          - { id: corner-bracket-2 }
          - { id: long-apron-1 }
          - { id: leg-2 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: angle-bracket, bracket: corner-bracket-2, edge: 0.25 } }
      - members:
          - { id: corner-bracket-3 }
          - { id: long-apron-2 }
          - { id: leg-3 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: angle-bracket, bracket: corner-bracket-3, edge: 0.25 } }
      - members:
          - { id: corner-bracket-4 }
          - { id: long-apron-2 }
          - { id: leg-4 }
        fasteners:
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: angle-bracket, bracket: corner-bracket-4, edge: 0.25 } }
      - members:
          - { id: post-1 }
          - { id: leg-2 }
        fasteners:
          - { kind: screw, stock: screw-wood-10x3, variant: { kind: centered, separation: 8, justify: space-around } }
      - members:
          - { id: beam-1 }
          - { id: post-1 }
        fasteners:
          - { kind: screw, stock: screw-wood-10x3, variant: { kind: centered, separation: 4, justify: space-around } }
      - members:
          - { id: beam-saddle-1 }
          - { id: beam-1 }
        fasteners:
          - { kind: bolt, stock: bolt-hex-1/2x6, variant: { kind: angle-bracket, bracket: beam-saddle-1, edge: 0.25 } }
      # Glue plus screws through the top into each apron.
      - members:
          - { id: top-1 }
          - { id: long-apron-1 }
        fasteners:
          - { kind: glue, stock: wood-glue }
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: centered, separation: 16, justify: space-around } }
      - members:
          - { id: top-1 }
          - { id: long-apron-2 }
        fasteners:
          - { kind: glue, stock: wood-glue }
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: centered, separation: 16, justify: space-around } }
      - members:
          - { id: top-1 }
          - { id: short-apron-1 }
        fasteners:
          - { kind: glue, stock: wood-glue }
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: centered, separation: 16, justify: space-around } }
      - members:
          - { id: top-1 }
          - { id: short-apron-2 }
        fasteners:
          - { kind: glue, stock: wood-glue }
          - { kind: screw, stock: screw-wood-8x1.25, variant: { kind: centered, separation: 16, justify: space-around } }

  - label: Shelf
    position: [ 8, 26.5, 24 ]
    members:
      - { id: shelf-board-1, position: [ 0, 3.5, -0.5 ], rotation: [ 90, 0, 0 ] }

  # Leftover cut-off on the floor — not fastened, so it stripes.
  - label: Spare
    position: [ 50, 0, 8 ]
    members:
      - { id: spare-block-1, position: [ 0, 3.5, 0 ], rotation: [ 90, 0, 0 ] }

# Document-level connection: glue the shelf component to the bench.
connections:
  - members:
      - { component: bench-1, id: long-apron-2 }
      - { component: shelf-1, id: shelf-board-1 }
    fasteners:
      - { kind: glue, stock: wood-glue }
